# defibrillator (WoL proxy + idle poweroff) + hermes-agent gateway, on the QNAP TS-464.
#
#   docker compose pull
#   docker compose up -d
#   docker compose logs -f defibrillator
#
# ---- networking intent ----
#   defibrillator  -> network_mode: host. It ORIGINATES a limited UDP
#                     broadcast (WOL 255.255.255.255:9), which is only
#                     delivered on the sender's local L2 segment and is
#                     never forwarded by a NAT bridge — so it must be in
#                     the host netns. It also dials the 5090's LAN IP and
#                     the SSH target directly. This is a deliberate choice,
#                     not a shortcut.
#   hermes-agent   -> isolated bridge. It only makes OUTBOUND calls
#                     (Telegram, model, tools). It reaches the proxy via
#                     host.docker.internal (-> host gateway).
#
# ---- required (put in .env or export) ----
#   WOL_MAC         NIC MAC of the 5090        (ip link on the 5090)
#   HERMES_API_KEY  32+ chars                  (openssl rand -hex 32)
# ---- optional (defaults below) ----
#   OLLAMA_LAN_IP   5090 LAN IP               (default 192.168.1.90)
#   SSH_TARGET      user@ip for poweroff      (default tammert@192.168.1.90)
#
# One-time box-side setup: the 5090 must accept the ./ssh/id_ed25519 key in the
# defibrillator user's authorized_keys, and a sudoers line must let that user
# run poweroff without a password (no polkit on that Debian box):
#   defibrillator ALL=(root) NOPASSWD: /usr/bin/systemctl poweroff
# The proxy then runs:  ssh defibrillator@192.168.1.90 'sudo systemctl poweroff'
# (POWEROFF_CMD env, defaulted to plain 'systemctl poweroff' for polkit boxes).

name: hermes

services:
  # --- WOL sender + LAN dialer: host networking is correct here ---
  defibrillator:
    image: tammert/defibrillator:latest   # pin a git-sha tag for production
    container_name: defibrillator
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: ":8080"
      BACKEND: "${OLLAMA_LAN_IP:-192.168.1.90}:11434"   # 5090 Ollama
      WOL_MAC: "${WOL_MAC:?WOL_MAC required, e.g. AA:BB:CC:DD:EE:FF}"
      WOL_BROADCAST: "255.255.255.255:9"
      WAKE_TIMEOUT: "5m"     # max total wait for one shared wake round
      IDLE_TIMEOUT: "30m"    # silence before requesting poweroff
      SSH_TARGET: "${SSH_TARGET:-tammert@192.168.1.90}"  # empty = wake-only, no poweroff
      # Box has no polkit, but a sudoers line authorizes this for the defibrillator user:
      POWEROFF_CMD: "sudo systemctl poweroff"
    volumes:
      # Ed25519 private key the 5090 authorizes. Dir 700, key 600, root-owned.
      ./ssh:/root/.ssh:ro

  # --- gateway: outbound only, so it lives on an isolated bridge ---
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    networks: [hermes-net]
    extra_hosts:
      # "the host" as seen from this container — this is where the proxy lives.
      - "host.docker.internal:host-gateway"
    volumes:
      - ~/.hermes:/opt/data          # existing data dir (config, .env, sessions, skills)
    environment:
      PUID: "1000"                  # = owner UID of ~/.hermes on the NAS
      PGID: "100"
      # Chat model routes THROUGH the proxy so it counts toward the idle clock.
      # In ~/.hermes/config.yaml (the model is a config.yaml key, not an env var):
      #   model:
      #     provider: openai
      #     model: qwen3.8:27b
      #     base_url: http://host.docker.internal:8080/v1   # -> defibrillator
      #   provider: openai
      #   openai.key_env: DUMMY
      API_SERVER_ENABLED: "true"    # OpenAI-compatible API / dashboard entry
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_KEY:?set HERMES_API_KEY = $(openssl rand -hex 32) in .env}"
      API_SERVER_CORS_ORIGINS: "*"
      # Dashboard (:9119) optional — a non-loopback bind REQUIRES an auth
      # provider or startup fails closed. Uncomment + set the basic-auth trio.
      # HERMES_DASHBOARD: "1"
      # HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "tammert"
      # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "..."
    ports:
      - "8642:8642"                 # API server / dashboard on the host
    shm_size: "1g"                 # browser tools
    command: ["gateway", "run"]

networks:
  hermes-net:
    driver: bridge
